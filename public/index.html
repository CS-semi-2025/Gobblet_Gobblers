<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ゲーム画面モックアップ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        <div id="opponent-area">
            <div class="timer">相手の時間</div>
            <div class="hand" id="opponent-hand">
                <div class="piece large orange"></div>
                <div class="piece large orange"></div>
                <div class="piece medium orange"></div>
                <div class="piece medium orange"></div>
                <div class="piece small orange"></div>
                <div class="piece small orange"></div>
            </div>
        </div>

        <div id="game-board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
        </div>

        <div id="player-area">
            <div class="hand" id="player-hand">
                <div class="piece large blue"></div>
                <div class="piece large blue"></div>
                <div class="piece medium blue"></div>
                <div class="piece medium blue"></div>
                <div class="piece small blue"></div>
                <div class="piece small blue"></div>
            </div>
            <div class="timer">自分の時間</div>
        </div>

        <button id="settings-button">設定 ⚙️</button>
    </div>

    <div id="modal-overlay" class="hidden"></div>
    <div id="settings-modal" class="hidden">
        
        <div class="modal-header">
            <h2 class="modal-title">設定</h2>
            <button id="close-modal-button" class="close-button">×</button>
        </div>

        <div class="modal-tabs">
            <button class="tab-button active" data-tab="tab-content-settings">環境設定</button>
            <button class="tab-button" data-tab="tab-content-controls">ゲーム操作</button>
            <button class="tab-button" data-tab="tab-content-help">ヘルプ/ルール</button>
        </div>

        <div class="modal-content">
            
            <div id="tab-content-settings" class="tab-content active">
                <div class="setting-group">
                    <h3>サウンド</h3>
                    <label>BGM: <input type="range" min="0" max="100" value="50"></label>
                    <label>効果音: <input type="range" min="0" max="100" value="50"></label>
                </div>
                <div class="setting-group">
                    <h3>操作補助</h3>
                    <label>
                        移動可能なマスをハイライト
                        <span class="toggle-switch">ON</span> </label>
                    <label>
                        「うっかり負け」警告
                        <span class="toggle-switch">ON</span> </label>
                </div>
            </div>

            <div id="tab-content-controls" class="tab-content">
                <button class="modal-action-button">この対戦をやり直す</button>
                <button class="modal-action-button">降参する</button>
            </div>

            <div id="tab-content-help" class="tab-content">
                <h3>簡単なルール説明</h3>
                <p>ここにルール説明のテキストが入ります。</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
