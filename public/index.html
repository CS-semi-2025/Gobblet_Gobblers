<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gobblet Gobblers - Multiplayer (3D)</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Gobblet Gobblers (3D)</h1>
      <div class="controls">
        <input id="nameInput" placeholder="あなたの名前" />
        <button id="joinBtn">Join</button>
        <button id="restartBtn" class="secondary">再戦</button>
        <button id="leaveBtn" class="secondary">退出</button>
            </div>
    </header>

    <main>
      <section class="board-wrap">
        </section>

      <aside class="panel">
        <div class="status">
          <div>あなた: <span id="meLabel">未割当</span></div>
          <div>ターン: <span id="turnLabel">—</span></div>
          <div>状態: <span id="gameStateLabel">待機中</span></div>
        </div>

        <div class="hand">
          <div><strong>手駒</strong></div>
          <div id="handContainer" class="hand-row"></div>
          <div class="hint">（3D版）手駒をクリック → 盤面のマスをクリックで配置。盤上の自分の駒をクリック → 移動先のマスをクリックで移動。</div>
        </div>

        <div class="log" id="log"></div>
      </aside>
    </main>
        </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/"
      }
    }
  </script>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="client.js"></script>
</body>
</html>
