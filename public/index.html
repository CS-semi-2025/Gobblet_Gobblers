<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Gobblet Gobblers - Multiplayer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Gobblet Gobblers</h1>
      <div class="controls">
        <input id="nameInput" placeholder="あなたの名前" />
        <button id="joinBtn">Join</button>
        <button id="restartBtn" class="secondary">再戦</button>
        <button id="leaveBtn" class="secondary">退出</button>
      </div>
    </header>

    <main>
      <section class="board-wrap">
        <div id="board" class="board" aria-label="game-board"></div>
      </section>

      <aside class="panel">
        <div class="status">
          <div>あなた: <span id="meLabel">未割当</span></div>
          <div>ターン: <span id="turnLabel">—</span></div>
          <div>状態: <span id="gameStateLabel">待機中</span></div>
        </div>

        <div class="hand">
          <div><strong>手駒</strong></div>
          <div id="handContainer" class="hand-row"></div>
          <div class="hint">手駒をクリック → 盤面のマスをクリックで配置。既に盤上の自分の見えている駒をクリックして移動できます。</div>
        </div>

        <div class="log" id="log"></div>
      </aside>
    </main>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>
</body>
</html>
